<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>مرغ‌دونی | VS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 45%,rgba(255,210,90,.14),transparent 25%),linear-gradient(135deg,#120d09,#24150d 45%,#0b0806);color:#fff}.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.glow{position:absolute;border-radius:50%;filter:blur(50px);opacity:.35}.g1{width:300px;height:300px;background:#ffb52e;left:-80px;top:10%}.g2{width:280px;height:280px;background:#3f8cff;right:-80px;bottom:5%}.vs-wrap{width:min(1100px,96vw);text-align:center;position:relative;z-index:2}.title{font-size:clamp(20px,4vw,38px);font-weight:900;text-shadow:0 4px 20px #000;margin-bottom:24px}.players{display:flex;align-items:center;justify-content:center;gap:clamp(12px,5vw,70px)}.card{width:min(330px,38vw);min-height:330px;padding:22px 18px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.25);box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.18);backdrop-filter:blur(12px);animation:float 3s ease-in-out infinite}.card:nth-child(3){animation-delay:.4s}.avatar{width:clamp(105px,16vw,155px);height:clamp(105px,16vw,155px);margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(55px,9vw,90px);background:radial-gradient(circle,#fff3b0,#d68b21 70%);border:6px solid rgba(255,255,255,.8);box-shadow:0 10px 35px rgba(0,0,0,.5);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.name{font-size:clamp(20px,3vw,30px);font-weight:900}.level{margin-top:8px;color:#ffe39a;font-size:14px}.stats{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}.stat{background:rgba(0,0,0,.25);padding:8px 13px;border-radius:13px;font-size:13px;border:1px solid rgba(255,255,255,.1)}.vs{font-size:clamp(55px,10vw,105px);font-weight:1000;font-style:italic;color:#ffe082;text-shadow:0 5px 0 #7b3500,0 0 35px #ff9f1c;animation:pulse 1.2s infinite alternate}.actions{margin-top:25px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{border:0;border-radius:16px;padding:13px 22px;font:900 15px Tahoma;cursor:pointer;color:#fff;background:linear-gradient(#ffb83d,#d86d12);box-shadow:0 7px 0 #713208,0 10px 25px rgba(0,0,0,.35)}button:active{transform:translateY(4px);box-shadow:0 3px 0 #713208}.mute{background:linear-gradient(#667085,#303846);box-shadow:0 7px 0 #171b22}.hint{margin-top:18px;font-size:11px;color:#c9bba5}.back{position:absolute;top:18px;right:18px;z-index:5;background:rgba(0,0,0,.4);box-shadow:none;border:1px solid #ffffff33;padding:9px 13px}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{to{transform:scale(1.08) rotate(-2deg)}}@media(max-width:650px){.players{gap:5px}.card{width:39vw;min-height:260px;padding:13px 8px;border-radius:20px}.avatar{border-width:4px}.stats{gap:5px}.stat{padding:6px 7px;font-size:10px}.title{margin-bottom:12px}.actions{margin-top:14px}button{padding:10px 14px;font-size:12px}}
</style></head><body><div class="stage"><div class="glow g1"></div><div class="glow g2"></div><button class="back" onclick="goBack()">↩️ بازگشت</button><div class="vs-wrap"><div class="title">⚔️ آماده‌ی نبرد مرغ‌دونی!</div><div class="players"><div class="card"><div class="avatar" id="avatar1">🐔</div><div class="name" id="name1">بازیکن اول</div><div class="level" id="level1">سطح ۱</div><div class="stats"><div class="stat">🥚 <span id="eggs1">0</span></div><div class="stat">🐥 <span id="chicks1">0</span></div></div></div><div class="vs">VS</div><div class="card"><div class="avatar" id="avatar2">🐓</div><div class="name" id="name2">بازیکن دوم</div><div class="level" id="level2">سطح ۱</div><div class="stats"><div class="stat">🥚 <span id="eggs2">0</span></div><div class="stat">🐥 <span id="chicks2">0</span></div></div></div></div><div class="actions"><button onclick="startGame()">🎮 شروع بازی</button><button class="mute" id="musicBtn" onclick="toggleMusic()">🔊 صدا روشن</button></div><div class="hint">نبرد در حال آماده‌سازی است…</div></div></div><audio id="vsMusic" loop preload="auto"><source src="/audio/clash-royale.mp3" type="audio/mpeg"></audio><script>
const params=new URLSearchParams(location.search);
let saved={};try{saved=JSON.parse(sessionStorage.getItem('morgdoni_vs_data')||'{}')||{}}catch(e){}
const players=Array.isArray(saved.players)?saved.players:[];
const p1=players[0]||{},p2=players[1]||{};
function setText(id,key,def){const el=document.getElementById(id);if(!el)return;const v=params.get(key);el.textContent=(v!==null&&v!==""?v:def||el.textContent)}
function safeAvatar(v,def){return v||def}
function setAvatar(id,value,def){const el=document.getElementById(id);if(!el)return;const a=safeAvatar(value,def);if(String(a).startsWith('data:image/')){const img=document.createElement('img');img.src=a;img.alt='آواتار';img.onerror=()=>{el.textContent=def};el.textContent='';el.appendChild(img)}else{el.textContent=a}}
setText('name1','p1',p1.name||p1.username||p1.displayName||'بازیکن اول');
setText('name2','p2',p2.name||p2.username||p2.displayName||'بازیکن دوم');
setAvatar('avatar1',p1.avatar||params.get('a1'),'🐔');setAvatar('avatar2',p2.avatar||params.get('a2'),'🐓');
document.getElementById('level1').textContent=p1.level||params.get('l1')||'سطح ۱';document.getElementById('level2').textContent=p2.level||params.get('l2')||'سطح ۱';document.getElementById('eggs1').textContent=p1.eggs??params.get('e1')??'0';document.getElementById('eggs2').textContent=p2.eggs??params.get('e2')??'0';document.getElementById('chicks1').textContent=p1.chicks??params.get('c1')??'0';document.getElementById('chicks2').textContent=p2.chicks??params.get('c2')??'0';
const music=document.getElementById('vsMusic'),musicBtn=document.getElementById('musicBtn');let musicOn=false;function startMusic(){music.play().then(()=>{musicOn=true;musicBtn.textContent='🔊 صدا روشن'}).catch(()=>{musicOn=false;musicBtn.textContent='🔇 برای پخش صدا لمس کن'})}function toggleMusic(){if(music.paused)startMusic();else{music.pause();musicOn=false;musicBtn.textContent='🔇 صدا خاموش'}}
function returnToGame(){try{const s=window.parent.__MORG_SOCKET__||window.parent.socket;if(s&&typeof s.emit==='function')s.emit('leaveGame');window.parent.postMessage({type:'morgdoni-vs-finished'},location.origin)}catch(e){}if(window.parent!==window)return;const room=params.get('room');location.href=room?'/?room='+encodeURIComponent(room):'/'}
function startGame(){returnToGame()}function goBack(){returnToGame()}
setTimeout(returnToGame,3500);document.addEventListener('click',()=>{if(!musicOn)startMusic()},{once:true});
</script></body></html>
