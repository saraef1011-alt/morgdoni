name: Connect presence cleanup

on:
  push:
    branches: [main]
    paths:
      - 'presence-cleanup.js'
      - 'worker.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Connect presence cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect helper to worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text(encoding='utf-8')
          if "from './presence-cleanup.js'" not in s:
              s = "import { cleanupDisconnectedPlayer } from './presence-cleanup.js';\n\n" + s
          old = "async close(id){await this.ready;const pending=this.data.pending[id]||[];for(const req of pending){if(this.data.online[req.fromId])this.send(req.fromId,'gameRequestCancelled',{reason:'طرف مقابل قطع شد'});if(this.data.online[req.fromId]?.status==='requesting')this.data.online[req.fromId].status='ready'}delete this.data.pending[id];for(const targetId of Object.keys(this.data.pending)){const arr=this.data.pending[targetId]||[];const kept=arr.filter(x=>x.fromId!==id);if(kept.length!==arr.length){this.data.pending[targetId]=kept;this.send(targetId,'gameRequestCancelled',{reason:'طرف مقابل قطع شد'})}}const cur=this.roomOf(id);if(cur){const r=cur.room;if(cur.role==='player')r.players=r.players.filter(p=>p.id!==id);else r.watchers=(r.watchers||[]).filter(x=>x!==id);if(!r.players.length)delete this.data.rooms[cur.roomId];else{if(r.host===id)r.host=r.players[0].id;if(r.currentTurn===id)r.currentTurn=r.players[0].id;this.roomBroadcast(r,'gameState',r);this.roomBroadcast(r,'webrtc-peer-left',{peerId:id})}}delete this.data.online[id];this.data.queue=this.data.queue.filter(x=>x!==id);this.sessions.delete(id);await this.save();this.updateList()}"
          new = "async close(id){await cleanupDisconnectedPlayer(this,id)}"
          if old not in s:
              raise SystemExit('Expected close(id) block was not found; worker.js was not changed.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit worker connection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'Connect presence cleanup'
          git push
