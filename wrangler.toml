name = "morgdoni-online"
main = "worker-entry.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/ws", "/healthz", "/socket.io/*"]
include = [
  "/*.html",
  "/*.js",
  "/*.css",
  "/*.png",
  "/*.jpg",
  "/*.jpeg",
  "/*.gif",
  "/*.svg",
  "/*.mp3",
  "/*.webp",
  "/*.ico",
  "/assets/**",
  "/cards/**",
  "/sounds/**"
]
exclude = [
  "/server.js",
  "/server.mjs",
  "/worker.js",
  "/worker-multi.js",
  "/worker-entry.js",
  "/presence-cleanup.js",
  "/online-panel.js",
  "/package.json",
  "/package-lock.json",
  "/node_modules/**",
  "/.git/**",
  "/tests/**"
]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
